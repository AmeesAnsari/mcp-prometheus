[project]
name = "mcp-prometheus"
version = "0.1.0"
description = "Read-only Prometheus tools for any MCP client: query, explore metrics, check targets and alerts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "httpx2>=2.10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcp-prometheus = "mcp_prometheus.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mcp_prometheus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
