name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      prometheus:
        image: prom/prometheus:v3.16.0
        ports: ["9090:9090"]
    env:
      PROMETHEUS_URL: http://localhost:9090
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Wait for Prometheus to scrape itself
        run: |
          for i in $(seq 1 30); do
            curl -sf "$PROMETHEUS_URL/api/v1/query?query=up" | grep -q '"result":\[{' && exit 0
            sleep 2
          done
          echo "Prometheus did not become ready" && exit 1
      - run: pytest -q -rs
